# HighGround: every night (and on every upload to main), run all the calculation tests, plus the dollar-flow checks on
# 5,000 random districts with a new random seed. If anything fails, GitHub emails the repository owner; the log names the
# failing test file (and, for the dollar-flow checks, the rule and the SEED to replay: SEED=<number> node dollarflow_test.js)
name: Nightly checks
on:
  schedule:
    - cron: '17 9 * * *'      # about 4:17 a.m. Central
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Chicago     # the same time zone the tests were written in
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'  # the same Node as the daily health check and the test machine
      - name: Calculation tests
        run: |
          node --version
          failed=""
          for t in *_test.js; do
            echo "::group::$t"
            if ! node "$t"; then failed="$failed $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Failed:$failed"; exit 1; fi
          echo "All calculation tests passed."
      - name: Dollar flow on 5,000 random districts (new seed each run)
        run: |
          SEED=$(( (RANDOM << 15) | RANDOM ))
          echo "SEED=$SEED"
          SEED=$SEED N=5000 node dollarflow_test.js || { echo "::error::Dollar-flow rule broken. Replay with SEED=$SEED node dollarflow_test.js"; exit 1; }
