name: Iowa public data

on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reload even if the files haven't changed"
        type: boolean
        default: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Load expenditures and revenues
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 loader/load_iowa_datahub.py ${{ inputs.force && '--force' || '' }}
