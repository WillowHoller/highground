name: Iowa public data

on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reload even if the files haven't changed"
        type: boolean
        default: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql and openpyxl
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          python -m pip install --quiet openpyxl
      - name: Load state annual reports and enrollment (FY2019 on)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python loader/load_iowa_car.py ${{ inputs.force && '--force' || '' }}
      - name: Load property tax levy rates (Department of Management, FY2019 on)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python loader/load_iowa_levy.py ${{ inputs.force && '--force' || '' }}
      - name: Load valuations, Aid and Levy and unspent balances (Department of Management)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python loader/load_iowa_dom.py ${{ inputs.force && '--force' || '' }}
      - name: Load construction prices (BLS) and home values (Census Bureau)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python loader/load_reference.py
      - name: Record that the monthly load finished
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -X -q -c "insert into public.ia_load_run (kind, status, message) values ('workflow_ok', 'ok', 'run ${{ github.run_id }}')"
      - name: Record that the monthly load failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -X -q -c "insert into public.ia_load_run (kind, status, message) values ('workflow', 'error', 'run ${{ github.run_id }} failed: see GitHub Actions')"
