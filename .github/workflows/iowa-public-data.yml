name: Iowa public data

on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reload even if the files haven't changed"
        type: boolean
        default: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql and openpyxl
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          python -m pip install --quiet openpyxl
      - name: Load state annual reports and enrollment (FY2019 on)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python loader/load_iowa_car.py ${{ inputs.force && '--force' || '' }}
